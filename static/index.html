<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- GitHub Pages sends no CSP header, so the policy is here. A meta tag
     can't carry frame-ancestors; main.ts refuses to run in a frame instead. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src https://api.github.com; img-src 'self'; manifest-src 'none'; base-uri 'none'; form-action 'none'; require-trusted-types-for 'script'; trusted-types dompurify">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>Review queue</title>
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1><a href="#">Needs you</a></h1>
    <span class="meta" id="meta">Starting…</span>
    <!-- On a narrow screen the controls fold into a menu; on a wide one, the toggle is hidden and they sit in the header. -->
    <button type="button" id="menu-toggle" class="small menu-toggle" aria-label="More" aria-expanded="false" aria-controls="menu">⋯</button>
    <div class="menu" id="menu">
      <span class="meta menu-meta" id="menu-meta"></span>
      <button type="button" id="advance" class="small" title="After you approve, answer or otherwise finish an entry, open the next one of the list you came from" hidden>Auto-next</button>
      <button type="button" id="theme" class="small">Theme</button>
      <a href="#state.json" id="state-link" class="small" hidden>state.json</a>
      <button type="button" id="copy-state" class="small" hidden>Copy state</button>
      <button type="button" id="signout" class="small" hidden>Sign out</button>
    </div>
  </header>
  <!-- The session chat (chat.ts), first under the header; it stays hidden unless chat-config.json enables it. -->
  <div id="chat" hidden></div>
  <!-- The "Ask anything" box: it files a note onto the board (captureview.ts). -->
  <div class="ask-box" id="ask">
    <div id="capture" hidden></div>
  </div>
  <p class="notice" id="notice" role="alert" hidden></p>
  <p class="done" id="done" role="status" hidden></p>
  <div id="view"></div>
</div>
</body>
</html>
