[package]
name = "review-service"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Builds the control app's state from GitHub queries and serves it, read-only, with the app"
publish = false

[[bin]]
name = "control-app"
path = "src/main.rs"

[dependencies]
anyhow = "1"
board-forge = { git = "https://github.com/cgwalters-forge/agent-board", rev = "7a1af07d7ffd10d2048efb98ba8010eb2f1e0c95" }
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
humantime = "2"
httpdate = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync", "process", "signal", "fs", "io-util"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["fs"] }
time = { version = "0.3", features = ["parsing"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
