# Only someone with write access may request a review, forks included.
hosts = ["github.com"]
repos = ["cgwalters-forge/review"]
bases = ["main"]
max_outputs = 11
max_patch_bytes = 1024
max_patch_files = 1

[outputs]
add_comment = { max = 1 }
noop = { max = 1 }
# Inline findings beside the verdict (agentic-job's docs/review.md, "Inline findings").
create_pull_request_review_comment = { max = 10 }

[trigger]
events = ["issue_comment"]
roles = ["admin", "maintain", "write"]
bots = []
forks = true
commands = ["/review"]
