# Automatic events admit forks; the called review workflow restricts automatic
# starts to OWNER/MEMBER/COLLABORATOR to prevent shared-budget exhaustion.
hosts = ["github.com"]
repos = ["cgwalters-forge/review"]
bases = ["main"]
max_outputs = 11
max_patch_bytes = 1024
max_patch_files = 1

[outputs]
add_comment = { max = 1 }
noop = { max = 1 }
# Inline findings beside the verdict (agentic-job's docs/review.md, "Inline findings").
create_pull_request_review_comment = { max = 10 }

[trigger]
events = ["pull_request_target", "pull_request"]
roles = ["all"]
bots = []
forks = true
