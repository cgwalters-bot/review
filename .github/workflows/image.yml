# Publish the control-plane service's image (service/Containerfile) to
# GHCR when a v* tag is pushed, under that tag alone: deployments pin a
# tag (or the digest this prints), and nothing moves under them.
name: image

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  image:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/review-service:${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
        run: |
          podman build -f service/Containerfile -t "$IMAGE" .
          podman login ghcr.io -u "$ACTOR" --password-stdin <<< "$GH_TOKEN"
          podman push --digestfile digest "$IMAGE"
          echo "Pushed $IMAGE@$(cat digest)" >> "$GITHUB_STEP_SUMMARY"
